                <!-- ===== Expense Module › Patient Expense — one row per applied or
                     confirmed patient. Ticket, visa and source costs are each recorded
                     separately from the row's action buttons, with their own date, since
                     they are paid at different times. The source is taken from the lead,
                     so a Source expense is what that source was paid; the eye button lists
                     every cost of that patient. Totals follow the filters (leave the dates
                     empty for lifetime). ===== -->
                <div class="row">
                    <div class="col-6 col-xl-3"><div class="card stat-tile"><div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-primary-subtle text-primary"><i class="mdi mdi-airplane"></i></span>
                        <div><div class="stat-value cur" id="px-sum-ticket">&#2547;0</div><div class="stat-label text-muted">Ticket</div></div>
                    </div></div></div>
                    <div class="col-6 col-xl-3"><div class="card stat-tile"><div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-info-subtle text-info"><i class="mdi mdi-passport"></i></span>
                        <div><div class="stat-value cur" id="px-sum-visa">&#2547;0</div><div class="stat-label text-muted">Visa</div></div>
                    </div></div></div>
                    <div class="col-6 col-xl-3"><div class="card stat-tile"><div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-warning-subtle text-warning"><i class="mdi mdi-share-variant-outline"></i></span>
                        <div><div class="stat-value cur" id="px-sum-source">&#2547;0</div><div class="stat-label text-muted">Paid to Source</div></div>
                    </div></div></div>
                    <div class="col-6 col-xl-3"><div class="card stat-tile"><div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-danger-subtle text-danger"><i class="mdi mdi-cash-minus"></i></span>
                        <div><div class="stat-value cur" id="px-sum-total">&#2547;0</div><div class="stat-label text-muted" id="px-sum-label">Total &middot; lifetime</div></div>
                    </div></div></div>
                </div>

                <div class="card">
                    <div class="card-header d-block">
                        <h5 class="card-title mb-0">Patient Expenses</h5>
                        <div class="row g-2 mt-2">
                            <div class="col-6 col-md-2">
                                <label class="form-label fs-12 mb-1" for="px-filter">Source</label>
                                <select class="form-select form-select-sm" id="px-filter"><option value="">All sources</option></select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label fs-12 mb-1" for="px-status">Status</label>
                                <select class="form-select form-select-sm" id="px-status"><option value="">All</option><option>Applied</option><option>Confirmed</option></select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label fs-12 mb-1" for="px-from">Expense from</label>
                                <input type="date" class="form-control form-control-sm" id="px-from">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label fs-12 mb-1" for="px-to">Expense to</label>
                                <input type="date" class="form-control form-control-sm" id="px-to">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label fs-12 mb-1" for="px-search">Search</label>
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control form-control-sm" id="px-search" placeholder="Patient, lead ID, guardian or phone...">
                                    <button type="button" class="btn btn-light btn-sm" id="px-reset" title="Reset filters"><i class="mdi mdi-refresh"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="px-table">
                                <thead class="table-light">
                                    <tr><th>Patient &amp; Lead ID</th><th>Guardian</th><th>Phone</th><th>Source</th><th>Status</th><th class="text-end">Total Expense</th><th class="no-sort text-nowrap">Action</th></tr>
                                </thead>
                                <tbody></tbody>
                                <tfoot><tr class="table-light"><td colspan="5" class="text-end fw-semibold">Total</td><td class="text-end cur fw-bold" id="px-foot">&#2547;0</td><td></td></tr></tfoot>
                            </table>
                            <p class="text-muted fs-13 text-center py-4 d-none" id="px-empty">No patients match this filter.</p>
                        </div>
                    </div>
                </div>

                <!-- Record / edit one ticket, visa or source cost -->
                <div class="modal fade" id="patientExpenseModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <div>
                                    <h5 class="modal-title" id="px-modal-title">Update Ticket Expense</h5>
                                    <div class="fs-12 text-muted" id="px-modal-sub"></div>
                                </div>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="alert alert-light border fs-13 py-2 mb-3" id="px-f-info"></div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="px-f-amount">Amount <span class="text-danger">*</span></label>
                                        <div class="input-group"><span class="input-group-text">&#2547;</span><input type="number" min="0" class="form-control" id="px-f-amount" placeholder="0"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="px-f-date">Expense date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="px-f-date">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="px-f-method">Payment method</label>
                                        <select class="form-select" id="px-f-method" data-crm-list="paymentMethods"><option>Cash</option><option>Bank Transfer</option><option>bKash</option><option>Nagad</option><option>Card</option><option>Cheque</option></select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="px-f-desc">Note</label>
                                        <input type="text" class="form-control" id="px-f-desc" placeholder="Optional">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" id="px-save">Save</button></div>
                        </div>
                    </div>
                </div>

                <!-- Every cost of one patient -->
                <div class="modal fade" id="patientCostsModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <div>
                                    <h5 class="modal-title" id="pv-title">Patient Costs</h5>
                                    <div class="fs-12 text-muted" id="pv-sub"></div>
                                </div>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-2 mb-3 text-center" id="pv-totals"></div>
                                <div class="table-responsive">
                                    <table class="table align-middle mb-0" id="pv-table">
                                        <thead class="table-light"><tr><th>Date</th><th>Type</th><th>Note</th><th>Method</th><th class="text-end">Amount</th><th class="no-sort text-nowrap">Action</th></tr></thead>
                                        <tbody></tbody>
                                    </table>
                                    <p class="text-muted fs-13 text-center py-4 d-none" id="pv-empty">No costs recorded for this patient yet.</p>
                                </div>
                            </div>
                            <div class="modal-footer justify-content-between">
                                <div class="d-flex flex-wrap gap-2">
                                    <button type="button" class="btn btn-sm btn-label-primary" data-pv-add="ticket"><i class="mdi mdi-airplane me-1"></i>Ticket</button>
                                    <button type="button" class="btn btn-sm btn-label-primary" data-pv-add="visa"><i class="mdi mdi-passport me-1"></i>Visa</button>
                                    <button type="button" class="btn btn-sm btn-label-primary" data-pv-add="source"><i class="mdi mdi-share-variant-outline me-1"></i>Source</button>
                                </div>
                                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
