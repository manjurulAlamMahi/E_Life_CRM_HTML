                                    <tr><td class="fw-semibold">Walk-in</td><td><span class="badge bg-secondary-subtle text-secondary">Channel</span></td><td class="fs-13 text-muted">&mdash;</td><td class="fs-13">&mdash;</td><td><span class="badge bg-success-subtle text-success">Active</span></td><td><button class="btn btn-sm btn-icon btn-light sa-edit" title="Edit"><i class="mdi mdi-pencil-outline"></i></button> <a href="sources.html" class="btn btn-sm btn-icon btn-light" title="View profile"><i class="mdi mdi-eye-outline"></i></a></td></tr>

                <div class="modal fade" id="sourceFormModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header"><h5 class="modal-title" id="sa-title">Create Source</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-8"><label class="form-label">Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="sa-name"></div>
                                    <div class="col-md-4"><label class="form-label">Type</label><select class="form-select" id="sa-type"><option>Person</option><option>Channel</option><option>Campaign</option></select></div>
                                    <div class="col-md-6"><label class="form-label">Contact person</label><input type="text" class="form-control"></div>
                                    <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control"></div>
                                    <div class="col-md-6"><label class="form-label">Commission rate (%)</label><input type="number" step="0.1" class="form-control" placeholder="0.0"></div>
                                    <div class="col-md-6"><label class="form-label">Status</label><select class="form-select"><option>Active</option><option>Inactive</option></select></div>
                                </div>
                            </div>
                            <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="sa-save">Save</button></div>
                        </div>
                    </div>
                </div>

                <script>
                (function () {
                    document.addEventListener('DOMContentLoaded', function () {
                        var title = document.getElementById('sa-title'), name = document.getElementById('sa-name');
                        document.getElementById('sa-add').addEventListener('click', function () { title.textContent = 'Create Source'; name.value = ''; name.classList.remove('is-invalid'); });
                        document.getElementById('sa-table').addEventListener('click', function (e) {
                            var b = e.target.closest('.sa-edit'); if (!b) return;
                            var row = b.closest('tr');
                            title.textContent = 'Edit Source'; name.value = row.cells[0].textContent.trim(); name.classList.remove('is-invalid');
                            bootstrap.Modal.getOrCreateInstance(document.getElementById('sourceFormModal')).show();
                        });
                        document.getElementById('sa-save').addEventListener('click', function () {
                            if (!name.value.trim()) { name.classList.add('is-invalid'); return; }
                            bootstrap.Modal.getOrCreateInstance(document.getElementById('sourceFormModal')).hide();
                            if (window.Swal) Swal.fire({ icon: 'success', title: 'Saved', text: name.value.trim() + ' has been saved.', confirmButtonColor: '#024766' });
                        });
                    });
                })();
                </script>
