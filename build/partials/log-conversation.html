                <!-- ===== Log Conversation — shared by Leads (All / Interested),
                     Upcoming Follow-ups and Not Interested. Logging a call always
                     ends in a next action, picked below: another follow-up, still
                     interested, apply for a package, not interested, or
                     unreachable. Applying hands over to the row's own "Apply for
                     Package" step (status-modals.html, which carries the Apply
                     block — it can only exist once per page), then the invoice.
                     The rest update the row in place. Wired in crm-leads.js
                     ("Log Conversation"). Injected at @log-conversation. ===== -->
                <div class="modal fade" id="logConvModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <div>
                                    <h5 class="modal-title mb-0">Log Conversation</h5>
                                    <span class="fs-12 text-muted" id="cv-lead-label"></span>
                                </div>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="alert alert-light border py-2 fs-13 d-none" id="cv-last"><i class="mdi mdi-history me-1"></i><span class="text-muted me-1">Last time:</span><span id="cv-last-text"></span></div>

                                <div class="row g-3">
                                    <div class="col-md-6"><label class="form-label">Channel <span class="text-danger">*</span></label><select class="form-select" id="cv-channel" data-crm-list="conversationChannels"><option selected>Phone</option><option>WhatsApp</option><option>In Person</option></select></div>
                                    <div class="col-md-6"><label class="form-label">Date</label><input type="date" class="form-control" id="cv-when"></div>
                                    <div class="col-12"><label class="form-label">What was discussed? <span class="text-danger">*</span></label><textarea class="form-control" id="cv-discussion" rows="3" placeholder="e.g. Guardian asked about the cost of the kidney package and the travel dates."></textarea><div class="invalid-feedback">Write a short note of the conversation.</div></div>
                                </div>

                                <div class="mt-3">
                                    <label class="form-label mb-2">What happens next? <span class="text-danger">*</span></label>
                                    <div class="cv-actions" id="cv-actions">
                                        <input type="radio" class="btn-check" name="cv-outcome" id="cv-o-followup" value="followup" autocomplete="off">
                                        <label class="btn cv-action" for="cv-o-followup"><i class="mdi mdi-calendar-clock"></i><span>Follow up again</span></label>
                                        <input type="radio" class="btn-check" name="cv-outcome" id="cv-o-interested" value="interested" autocomplete="off">
                                        <label class="btn cv-action" for="cv-o-interested"><i class="mdi mdi-thumb-up-outline"></i><span>Interested</span></label>
                                        <input type="radio" class="btn-check" name="cv-outcome" id="cv-o-applied" value="applied" autocomplete="off">
                                        <label class="btn cv-action cv-action-primary" for="cv-o-applied"><i class="mdi mdi-clipboard-check-outline"></i><span>Apply for Package</span></label>
                                        <input type="radio" class="btn-check" name="cv-outcome" id="cv-o-not-interested" value="not-interested" autocomplete="off">
                                        <label class="btn cv-action" for="cv-o-not-interested"><i class="mdi mdi-thumb-down-outline"></i><span>Not Interested</span></label>
                                        <input type="radio" class="btn-check" name="cv-outcome" id="cv-o-unreachable" value="unreachable" autocomplete="off">
                                        <label class="btn cv-action" for="cv-o-unreachable"><i class="mdi mdi-phone-off-outline"></i><span>Unreachable</span></label>
                                    </div>
                                    <div class="text-danger fs-12 mt-1 d-none" id="cv-outcome-error">Choose what happens next.</div>
                                </div>

                                <div class="row g-3 mt-0">
                                    <div class="col-md-6 d-none" id="cv-date-wrap">
                                        <label class="form-label" id="cv-date-label">Next follow-up date</label>
                                        <input type="date" class="form-control" id="cv-date">
                                        <div class="invalid-feedback">Pick the date for the next follow-up.</div>
                                    </div>
                                    <div class="col-md-6 d-none" id="cv-plan-wrap">
                                        <label class="form-label">Planned action</label>
                                        <select class="form-select" id="cv-plan" data-crm-list="followupActions"><option>Call again</option><option>Send package quotation</option><option>Share doctor's opinion</option><option>Invite to office visit</option><option>Collect documents</option></select>
                                    </div>
                                    <div class="col-12 d-none" id="cv-reason-wrap">
                                        <label class="form-label">Reason <span class="text-danger">*</span></label>
                                        <select class="form-select mb-2" id="cv-reason-pick" data-crm-list="notInterestedReasons,unreachableReasons"><option value="">Select a reason</option><option>Price beyond budget</option><option>Continuing treatment locally</option><option>Chose another agency</option><option>Patient condition changed</option><option>Phone switched off / no answer</option><option>Wrong number</option><option>Other</option></select>
                                        <textarea class="form-control" id="cv-reason" rows="2" placeholder="Anything else worth recording"></textarea>
                                        <div class="invalid-feedback">Choose a reason.</div>
                                    </div>
                                    <div class="col-12 d-none" id="cv-apply-note">
                                        <div class="alert alert-primary py-2 fs-13 mb-0"><i class="mdi mdi-arrow-right-circle-outline me-1"></i>Saving opens <strong>Apply for Package</strong> for this lead &mdash; choose the package, agree the price and log any payment, then the invoice.</div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <a href="conversations.html" class="btn btn-light me-auto" id="cv-timeline"><i class="mdi mdi-timeline-text-outline me-1"></i>Full Timeline</a>
                                <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                                <button class="btn btn-primary" id="cv-save"><i class="mdi mdi-content-save-outline me-1"></i><span>Save Conversation</span></button>
                            </div>
                        </div>
                    </div>
                </div>
